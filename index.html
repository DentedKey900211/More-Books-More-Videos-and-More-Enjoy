<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cuidemos al Pejelagarto</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Libre+Baskerville:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --water-deep: #0a2e2e;
      --water-mid:  #0f4d40;
      --water-light:#1a7a5e;
      --reed:       #4a7c3f;
      --gold:       #c8a84b;
      --cream:      #f5edd8;
      --bark:       #5c3d1e;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Libre Baskerville', serif;
      background: var(--water-deep);
      color: var(--cream);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      position: relative;
    }

    /* ── Animated water background ── */
    .water-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }
    .water-layer {
      position: absolute;
      width: 200%;
      height: 200%;
      top: -50%;
      left: -50%;
      border-radius: 40%;
      opacity: 0.18;
      animation: swirl 18s linear infinite;
    }
    .water-layer:nth-child(1){ background: radial-gradient(ellipse at 40% 60%, var(--water-light), transparent 60%); animation-duration: 20s; }
    .water-layer:nth-child(2){ background: radial-gradient(ellipse at 60% 40%, var(--reed), transparent 55%); animation-duration: 26s; animation-direction: reverse; }
    .water-layer:nth-child(3){ background: radial-gradient(ellipse at 50% 50%, var(--gold), transparent 45%); animation-duration: 14s; opacity: 0.08; }
    @keyframes swirl {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* ripple rings */
    .ripple {
      position: fixed;
      border-radius: 50%;
      border: 1px solid rgba(200,168,75,0.15);
      animation: ripple-out 8s ease-out infinite;
      pointer-events: none;
    }
    .ripple:nth-child(1){ width:300px; height:300px; top:20%; left:15%; animation-delay:0s; }
    .ripple:nth-child(2){ width:500px; height:500px; top:55%; left:60%; animation-delay:3s; }
    .ripple:nth-child(3){ width:200px; height:200px; top:70%; left:30%; animation-delay:5s; }
    @keyframes ripple-out {
      0%   { transform: scale(0.5); opacity: 0.4; }
      100% { transform: scale(2);   opacity: 0; }
    }

    /* ── Layout ── */
    .page {
      position: relative;
      z-index: 2;
      width: min(960px, 95vw);
      display: grid;
      grid-template-rows: auto auto;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      align-items: center;
    }

    /* ── Header spans full width ── */
    .header {
      grid-column: 1 / -1;
      text-align: center;
      padding: 0 1rem 2.8rem;
      animation: fade-down 1s ease both;
    }
    @keyframes fade-down {
      from { opacity: 0; transform: translateY(-30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .fish-icon {
      font-size: clamp(3rem, 8vw, 5.5rem);
      display: block;
      margin-bottom: 0.3rem;
      filter: drop-shadow(0 0 18px rgba(200,168,75,0.5));
      animation: bob 3s ease-in-out infinite;
    }
    @keyframes bob {
      0%,100% { transform: translateY(0) rotate(-2deg); }
      50%      { transform: translateY(-10px) rotate(2deg); }
    }

    .title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.01em;
      color: var(--cream);
      text-shadow: 0 2px 30px rgba(200,168,75,0.3);
    }
    .title em {
      font-style: italic;
      color: var(--gold);
    }

    .subtitle {
      margin-top: 0.5rem;
      font-style: italic;
      font-size: clamp(0.8rem, 2vw, 1rem);
      color: rgba(245,237,216,0.55);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* ── Divider ── */
    .divider {
      grid-column: 1 / -1;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold), transparent);
      margin-bottom: 2.5rem;
      opacity: 0.4;
    }

    /* ── Cards ── */
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.1rem;
      padding: 2.8rem 2rem 3rem;
      margin: 0 1rem;
      border: 1px solid rgba(200,168,75,0.2);
      border-radius: 4px;
      background: rgba(10,46,46,0.55);
      backdrop-filter: blur(10px);
      cursor: pointer;
      text-decoration: none;
      color: var(--cream);
      position: relative;
      overflow: hidden;
      transition: transform 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
      animation: fade-up 1s ease both;
    }
    .card:nth-child(3){ animation-delay: 0.15s; }
    .card:nth-child(4){ animation-delay: 0.30s; }
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* shimmer on hover */
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent 40%, rgba(200,168,75,0.08) 50%, transparent 60%);
      transform: translateX(-100%);
      transition: transform 0.6s ease;
    }
    .card:hover::before { transform: translateX(100%); }

    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(200,168,75,0.7);
      box-shadow: 0 16px 40px rgba(0,0,0,0.45), 0 0 24px rgba(200,168,75,0.15);
    }

    .card-icon {
      font-size: clamp(2.8rem, 6vw, 4rem);
      line-height: 1;
      filter: drop-shadow(0 0 10px rgba(200,168,75,0.3));
      transition: transform 0.35s ease;
    }
    .card:hover .card-icon { transform: scale(1.15) rotate(-5deg); }

    .card-img-wrap {
      width: 100%;
      height: 160px;
      overflow: hidden;
      border-radius: 3px;
      margin-bottom: 0.4rem;
      position: relative;
    }
    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transition: transform 0.5s ease;
      filter: saturate(0.85) brightness(0.88);
    }
    .card:hover .card-img-wrap img {
      transform: scale(1.07);
      filter: saturate(1.1) brightness(0.95);
    }
    .card-img-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 40%, rgba(10,46,46,0.7) 100%);
      pointer-events: none;
    }

    .card-label {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.3rem, 3vw, 1.8rem);
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .card-desc {
      font-size: clamp(0.75rem, 1.5vw, 0.88rem);
      color: rgba(245,237,216,0.55);
      font-style: italic;
      text-align: center;
      max-width: 18ch;
    }

    .card-arrow {
      margin-top: 0.4rem;
      width: 36px;
      height: 2px;
      background: var(--gold);
      position: relative;
      opacity: 0;
      transform: translateX(-8px);
      transition: opacity 0.3s, transform 0.3s;
    }
    .card-arrow::after {
      content: '';
      position: absolute;
      right: -1px;
      top: -4px;
      width: 10px;
      height: 10px;
      border-top: 2px solid var(--gold);
      border-right: 2px solid var(--gold);
      transform: rotate(45deg);
    }
    .card:hover .card-arrow {
      opacity: 1;
      transform: translateX(0);
    }

    /* accent colours per card */
    .card-videos .card-label { color: #7dd8c6; }
    .card-books  .card-label { color: #e8c87a; }

    /* ── Footer ── */
    .footer {
      grid-column: 1 / -1;
      text-align: center;
      margin-top: 2.5rem;
      font-size: 0.72rem;
      color: rgba(245,237,216,0.3);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* ── Responsive ── */
    @media (max-width: 560px) {
      html, body { overflow: auto; }
      .page { grid-template-columns: 1fr; }
      .card { margin: 0.5rem 0; }
      .divider { margin-bottom: 1.5rem; }
    }
  </style>
</head>
<body>

  <!-- Background -->
  <div class="water-bg">
    <div class="water-layer"></div>
    <div class="water-layer"></div>
    <div class="water-layer"></div>
  </div>
  <div class="ripple"></div>
  <div class="ripple"></div>
  <div class="ripple"></div>

  <!-- Main layout -->
  <div class="page">

    <!-- Header -->
    <header class="header">
      <span class="fish-icon">🐊</span>
      <h1 class="title">Cuidemos al <em>Pejelagarto</em></h1>
      <p class="subtitle">Especie emblemática de los ríos tropicales</p>
    </header>

    <div class="divider"></div>

    <!-- Card: Videos -->
    <a class="card card-videos" href="https://dentedkey900211.github.io/Videos-videos-and-more-videos/" target="_blank" rel="noopener">
      <div class="card-img-wrap"><img src="https://upload.wikimedia.org/wikipedia/commons/3/39/Atractosteus_tropicus.jpg" alt="Pejelagarto tropical" /></div>
      <span class="card-icon">🎬</span>
      <span class="card-label">Ver Videos</span>
      <span class="card-desc">Documentales y material audiovisual</span>
      <span class="card-arrow"></span>
    </a>

    <!-- Card: Libros -->
    <a class="card card-books" href="https://dentedkey900211.github.io/Books-Books-and-more-Books/" target="_blank" rel="noopener">
      <div class="card-img-wrap"><img src="https://upload.wikimedia.org/wikipedia/commons/5/50/Alligator_gar.jpg" alt="Pejelagarto diferente" /></div>
      <span class="card-icon">📖</span>
      <span class="card-label">Leer Libros</span>
      <span class="card-desc">Guías y lecturas sobre conservación</span>
      <span class="card-arrow"></span>
    </a>

    <p class="footer">Protege nuestra fauna acuática &nbsp;·&nbsp; Tabasco &amp; Chiapas</p>

  </div>

</body>
</html>
